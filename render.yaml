# Blueprint de Render: app Express + PostgreSQL
services:
  - type: web
    name: fichero
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fichero-db
          property: connectionString
      - key: ACCESS_CODE
        sync: false

databases:
  - name: fichero-db
    # Render ya no ofrece "free" en Postgres; 0.1c-256mb es el plan de entrada.
    plan: 0.1c-256mb
