services:
  - type: web
    name: fichero
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fichero-db
          property: connectionString
      - key: ACCESS_CODE
        sync: false

databases:
  - name: fichero-db
    plan: free
